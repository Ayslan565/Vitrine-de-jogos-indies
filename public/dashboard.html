<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Painel - IndieHub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .dashboard-container {
            min-height: calc(100vh - 200px);
            padding: 2rem 5%;
        }

        .profile-container {
            background: linear-gradient(135deg, var(--surface-light), var(--surface-color));
            padding: 2.5rem;
            border-radius: 12px;
            margin-bottom: 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 24px rgba(0, 208, 132, 0.1);
            transition: all 0.3s ease;
        }

        .profile-container:hover {
            border-color: var(--primary-color);
            box-shadow: 0 12px 32px rgba(0, 208, 132, 0.15);
        }

        .profile-info h3 {
            margin: 0 0 10px 0;
            color: var(--primary-color);
            font-size: 1.8rem;
            font-weight: 700;
        }

        .profile-info p {
            margin: 8px 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .profile-info p#bio-dev {
            margin-top: 15px;
            color: var(--text-color);
            font-style: italic;
            font-size: 1rem;
        }

        .profile-actions {
            display: flex;
            gap: 1rem;
        }

        .btn-lancar {
            background: linear-gradient(135deg, var(--primary-color), #00b870);
            color: var(--bg-color);
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 6px 20px rgba(0, 208, 132, 0.35);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: none;
            cursor: pointer;
            display: inline-block;
        }

        .btn-lancar:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 208, 132, 0.5);
        }

        .btn-lancar:active {
            transform: translateY(-1px);
        }

        .section-title {
            font-size: 2rem;
            margin-bottom: 2rem;
            font-weight: 700;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 32px;
            background: linear-gradient(180deg, var(--primary-color), var(--accent-color));
            border-radius: 2px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            animation: fadeIn 0.6s ease;
        }

        .game-card {
            background-color: var(--surface-light);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            cursor: pointer;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        .game-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(0, 208, 132, 0.1), rgba(255, 215, 0, 0.05));
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 1;
        }

        .game-card:hover {
            transform: translateY(-8px);
            border-color: var(--primary-color);
            box-shadow: 0 12px 32px rgba(0, 208, 132, 0.2);
        }

        .game-card:hover::before {
            opacity: 1;
        }

        .game-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .game-card:hover img {
            transform: scale(1.08);
        }

        .game-card > div {
            padding: 18px;
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 2;
        }

        .game-card h3 {
            margin: 0 0 10px 0;
            color: var(--text-color);
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.3;
        }

        .game-card p {
            margin: 0 0 15px 0;
            color: var(--primary-color);
            font-weight: 700;
            font-size: 1.1rem;
        }

        .game-card-actions {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: auto;
            padding-top: 10px;
        }

        .btn-edit {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            margin-bottom: 8px;
        }

        .btn-edit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
        }

        .btn-edit:active {
            transform: translateY(0);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
            margin-top: 8px;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(239, 68, 68, 0.4);
        }

        .btn-danger:active {
            transform: translateY(0);
        }

        #modal-editar, #modal-apagar {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background: linear-gradient(135deg, var(--surface-light), var(--surface-color));
            padding: 2.5rem;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: slideInUp 0.3s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .modal-content h3 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            color: var(--primary-color);
            font-size: 1.5rem;
            font-weight: 700;
        }

        .modal-content label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-color);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .modal-content input,
        .modal-content textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 1.5rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .modal-content input:focus,
        .modal-content textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 208, 132, 0.1);
            background: rgba(0, 0, 0, 0.5);
        }

        .modal-content textarea {
            resize: vertical;
            min-height: 120px;
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .modal-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-actions .btn-save {
            background: linear-gradient(135deg, var(--primary-color), #00b870);
            color: var(--bg-color);
            box-shadow: 0 4px 12px rgba(0, 208, 132, 0.3);
        }

        .modal-actions .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 208, 132, 0.4);
        }

        .modal-actions .btn-cancel {
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .modal-actions .btn-cancel:hover {
            background: rgba(0, 0, 0, 0.5);
            border-color: var(--primary-color);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .profile-container {
                flex-direction: column;
                gap: 1.5rem;
                text-align: center;
            }

            .profile-actions {
                flex-direction: column;
                width: 100%;
            }

            .btn-lancar {
                width: 100%;
            }

            .games-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 16px;
            }

            .modal-content {
                width: 95%;
                padding: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .dashboard-container {
                padding: 1rem 4%;
            }

            .profile-container {
                padding: 1.5rem;
            }

            .games-grid {
                grid-template-columns: 1fr;
            }

            .section-title {
                font-size: 1.3rem;
            }

            .modal-content {
                width: 100%;
                max-width: none;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">IndieHub</div>
        <nav>
            <a href="/">Vitrine Pública</a>
            <a href="/login.html">Sair</a>
        </nav>
    </header>

    <main class="dashboard-container">
        <div class="profile-container">
            <div class="profile-info">
                <h3 id="nome-dev">Carregando perfil...</h3>
                <p id="email-dev"></p>
                <p id="bio-dev"></p>
            </div>
            <div class="profile-actions">
                <a href="/upload.html" class="btn-lancar">Lançar Novo Jogo</a>
            </div>
        </div>

        <h2 class="section-title">Meus Jogos Publicados</h2>
        
        <div class="games-grid" id="meus-jogos-grid">
            <p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 2rem;">Carregando seus jogos...</p>
        </div>
    </main>

    <div id="modal-editar">
        <div class="modal-content">
            <h3>Editar Jogo</h3>
            <form id="form-editar">
                <input type="hidden" id="edit-id">
                
                <label for="edit-titulo">Título:</label>
                <input type="text" id="edit-titulo" required>
                
                <label for="edit-preco">Preço (R$):</label>
                <input type="number" id="edit-preco" step="0.01" required>
                
                <label for="edit-descricao">Descrição:</label>
                <textarea id="edit-descricao" required></textarea>
                
                <div class="modal-actions">
                    <button type="submit" class="btn-save">Salvar Alterações</button>
                    <button type="button" class="btn-cancel" onclick="fecharModal()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modal-apagar">
        <div class="modal-content">
            <h3>Apagar Jogo</h3>
            <p style="color: var(--text-color); font-size: 1rem; margin: 1.5rem 0; line-height: 1.6;">
                Tem certeza que deseja apagar este jogo? <strong>Esta ação não pode ser desfeita</strong> e todos os dados do jogo serão removidos permanentemente.
            </p>
            <div class="modal-actions">
                <button type="button" class="btn-save" id="btn-confirmar-apagar" style="background: linear-gradient(135deg, #ef4444, #dc2626);">Apagar Jogo</button>
                <button type="button" class="btn-cancel" onclick="fecharModalApagar()">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="script_Dash.js"></script>
</body>
</html>
