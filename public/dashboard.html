<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Painel - IndieHub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .profile-container {
            background-color: var(--surface-color);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #444;
        }
        .profile-info h3 { margin: 0 0 5px 0; color: #a855f7; }
        .profile-info p { margin: 0; color: #ccc; font-size: 0.9rem; }
        
        .btn-lancar {
            background-color: #a855f7;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: 0.3s;
        }
        .btn-lancar:hover { background-color: #9333ea; }
        
        .btn-danger {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-weight: bold;
        }
        .btn-danger:hover { background-color: #dc2626; }

        .btn-edit {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-weight: bold;
        }
        .btn-edit:hover { background-color: #2563eb; }

        /* Estilo da janela de edição (Modal) */
        #modal-editar {
            display: none; 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.8); 
            align-items: center; justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: var(--surface-color);
            padding: 2rem;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
        }
        .modal-content input, .modal-content textarea {
            width: 100%; padding: 10px; margin-bottom: 15px;
            background: #2d2d2d; border: 1px solid #444;
            color: white; border-radius: 4px; box-sizing: border-box;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">IndieHub | Painel do Desenvolvedor</div>
        <nav>
            <a href="/">Vitrine Publica</a>
            <a href="/login.html">Sair</a>
        </nav>
    </header>

    <main class="container">
        <div class="profile-container">
            <div class="profile-info">
                <h3 id="nome-dev">Carregando perfil...</h3>
                <p id="email-dev"></p>
                <p id="bio-dev" style="margin-top: 10px; font-style: italic;"></p>
            </div>
            <div>
                <a href="/upload.html" class="btn-lancar">Lancar Novo Jogo</a>
            </div>
        </div>

        <h2 class="section-title">Meus Jogos Publicados</h2>
        
        <div class="games-grid" id="meus-jogos-grid">
            <p>Carregando os seus jogos...</p>
        </div>
    </main>

    <div id="modal-editar">
        <div class="modal-content">
            <h3 style="margin-top: 0;">Editar Jogo</h3>
            <form id="form-editar">
                <input type="hidden" id="edit-id">
                
                <label>Titulo:</label>
                <input type="text" id="edit-titulo" required>
                
                <label>Preco (R$):</label>
                <input type="number" id="edit-preco" step="0.01" required>
                
                <label>Descricao:</label>
                <textarea id="edit-descricao" rows="4" required></textarea>
                
                <button type="submit" class="btn-edit" style="margin-top: 0;">Salvar Alteracoes</button>
                <button type="button" class="btn-danger" onclick="fecharModal()">Cancelar</button>
            </form>
        </div>
    </div>

    <script src="script_Dash.js"></script>
</body>
</html>
