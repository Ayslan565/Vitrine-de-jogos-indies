<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Jogo - IndieHub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .game-header {
            margin-bottom: 1.5rem;
        }
        .game-header h1 {
            font-size: 2.5rem;
            color: #fff;
            margin: 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .game-layout {
            display: grid;
            grid-template-columns: 2fr 1fr; 
            gap: 2rem;
            align-items: start;
        }

        .game-main img {
            width: 100%;
            max-height: 500px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            border: 1px solid #333;
        }

        .game-about {
            background-color: var(--surface-color);
            padding: 2rem;
            border-radius: 8px;
            margin-top: 2rem;
            border: 1px solid #333;
        }
        .game-about h3 {
            color: #a855f7;
            margin-top: 0;
            font-size: 1.5rem;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }
        .game-about p {
            line-height: 1.6;
            color: #d1d5db;
            white-space: pre-wrap;
        }

        .game-sidebar {
            position: sticky;
            top: 2rem; 
        }

        .buy-card {
            background-color: var(--surface-color);
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid #333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-align: center;
        }
        .buy-card .dev-id {
            color: #9ca3af;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            text-align: left;
        }
        .buy-card .price {
            font-size: 2rem;
            color: #4ade80;
            font-weight: bold;
            margin: 1rem 0 1.5rem 0;
        }
        .btn-play {
            background: linear-gradient(135deg, #a855f7, #7e22ce);
            color: white;
            text-decoration: none;
            padding: 15px 20px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1.1rem;
            display: block;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-play:hover {
            background: linear-gradient(135deg, #9333ea, #6b21a8);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.4);
        }

        @media (max-width: 768px) {
            .game-layout {
                grid-template-columns: 1fr; 
            }
            .game-sidebar {
                grid-row: 1; 
                position: static;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">IndieHub</div>
        <nav>
            <a href="/">Voltar a Vitrine</a>
        </nav>
    </header>

    <main class="container">
        <div id="conteudo-jogo">
            <h2 style="text-align: center; color: #a855f7;">Carregando informações do jogo...</h2>
        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const idDoJogo = urlParams.get('id');

        async function carregarDetalhes() {
            if (!idDoJogo) {
                document.getElementById('conteudo-jogo').innerHTML = '<h2 style="text-align: center; color: #ef4444;">Jogo nao especificado no link.</h2>';
                return;
            }

            try {
                const resposta = await fetch(`/api/jogos/${idDoJogo}`);
                
                if (!resposta.ok) {
                    document.getElementById('conteudo-jogo').innerHTML = '<h2 style="text-align: center; color: #ef4444;">Jogo nao encontrado.</h2>';
                    return;
                }

                const jogo = await resposta.json();
                const container = document.getElementById('conteudo-jogo');

                container.innerHTML = `
                    <div class="game-header">
                        <h1>${jogo.title}</h1>
                    </div>
                    
                    <div class="game-layout">
                        <div class="game-main">
                            <img src="${jogo.imagem}" alt="Capa de ${jogo.title}">
                            
                            <div class="game-about">
                                <h3>Sobre este jogo</h3>
                                <p>${jogo.description}</p>
                            </div>
                        </div>

                        <div class="game-sidebar">
                            <div class="buy-card">
                                <p class="dev-id">Desenvolvedor ID: ${jogo.developer_id}</p>
                                <p class="price">R$ ${jogo.preco}</p>
                                <a href="${jogo.url}" class="btn-play" target="_blank">Acessar Link do Jogo</a>
                            </div>
                        </div>
                    </div>
                `;

            } catch (erro) {
                console.error("Erro ao carregar:", erro);
                document.getElementById('conteudo-jogo').innerHTML = '<h2 style="text-align: center; color: #ef4444;">Erro ao conectar com o servidor.</h2>';
            }
        }

        carregarDetalhes();
    </script>
</body>
</html>
