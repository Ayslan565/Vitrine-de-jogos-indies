<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registo - IndieHub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .form-container {
            background-color: var(--surface-color);
            padding: 2rem;
            border-radius: 8px;
            max-width: 400px;
            margin: 2rem auto;
        }
        .form-container input, .form-container textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
            box-sizing: border-box; /* Garante que o padding não quebre o layout */
        }
        #mensagemInfo { margin-top: 10px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <header>
        <div class="logo">IndieHub</div>
        <nav><a href="/">⬅ Voltar à Vitrine</a></nav>
    </header>

    <main class="container">
        <h2 class="section-title" style="text-align: center;">Criar Conta de Desenvolvedor</h2>
        
        <div class="form-container">
            <form id="form-cadastro">
                <label for="username">Nome do Estúdio / Programador:</label>
                <input type="text" id="username" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" required>
                
                <label for="senha">Senha:</label>
                <input type="password" id="senha" required>

                <label for="bio">Biografia:</label>
                <textarea id="bio" rows="3"></textarea>
                
                <button type="submit" class="btn-upload" style="width: 100%;">Criar Conta</button>
            </form>
            <p id="mensagemInfo"></p>
        </div>
    </main>

    <script>
        document.getElementById('form-cadastro').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const bio = document.getElementById('bio').value;
            const mensagem = document.getElementById('mensagemInfo');

            mensagem.style.color = "yellow";
            mensagem.innerText = "A processar registo...";

            try {
                const resposta = await fetch('/api/cadastro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, senha, bio })
                });

                const dados = await resposta.json();

                if (resposta.ok) {
                    mensagem.style.color = "#4ade80"; // Verde
                    mensagem.innerText = "Conta criada! Redirecionando...";
                    setTimeout(() => window.location.href = '/login.html', 1500);
                } else {
                    mensagem.style.color = "red";
                    mensagem.innerText = dados.erro;
                }
            } catch (erro) {
                mensagem.style.color = "red";
                mensagem.innerText = "Erro ao conectar ao servidor.";
            }
        });
    </script>
</body>
</html>
