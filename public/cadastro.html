<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registo - IndieHub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .form-container {
            background-color: var(--surface-color);
            padding: 2rem;
            border-radius: 8px;
            max-width: 400px;
            margin: 2rem auto;
        }
        .form-container input, .form-container textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
            box-sizing: border-box; 
        }
        #mensagemInfo { margin-top: 10px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <header>
        <div class="logo">IndieHub</div>
        <nav><a href="/">⬅ Voltar à Vitrine</a></nav>
    </header>

    <main class="container">
        <h2 class="section-title" style="text-align: center;">Criar Conta de Desenvolvedor</h2>
        
        <div class="form-container">
            <form id="form-cadastro">
                <label for="username">Nome do Estúdio / Programador:</label>
                <input type="text" id="username" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" required>
                
                <label for="senha">Senha:</label>
                <input type="password" id="senha" required>

                <label for="bio">Biografia:</label>
                <textarea id="bio" rows="3"></textarea>
                
                <button type="submit" class="btn-upload" style="width: 100%;">Criar Conta</button>
            </form>
            <p id="mensagemInfo"></p>
        </div>
    </main>
    <script src="script_Cad_Log.js"> </script>
</body>
</html>
